plugins { id 'com.android.application' }
android {
    namespace 'io.gblink.companion'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.gblink.companion'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-alpha'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { jniLibs { useLegacyPackaging true } }
}
